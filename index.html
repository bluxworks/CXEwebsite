<!DOCTYPE html>

<title>CFXE | blux</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0b0f;
    color: #e8e8ee;
    font-family: "Courier New", Courier, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .wrap {
    text-align: center;
    padding: 24px;
    width: 100%;
    max-width: 520px;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    animation: fadeIn 0.8s ease both, float 3s ease-in-out infinite;
  }

  h1 {
    margin-top: 22px;
    font-size: 2.6rem;
    letter-spacing: 4px;
  }

  .typed {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    width: 0;
    border-right: 3px solid #e8e8ee;
    animation:
      type 1.2s steps(4) 0.6s forwards,
      blink 0.7s step-end infinite;
  }

  .bar {
    height: 2px;
    background: #e8e8ee;
    margin: 18px auto 0;
    width: 0;
    animation: grow 1s ease 2.0s forwards;
  }

  .sub {
    margin-top: 16px;
    opacity: 0;
    animation: fadeIn 0.8s ease 2.3s forwards;
  }

  .links {
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .links a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border: 1px solid #2a2a33;
    color: #e8e8ee;
    text-decoration: none;
    font-size: 0.95rem;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUp 0.5s ease forwards;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .links a:nth-child(1) { animation-delay: 2.7s; }
  .links a:nth-child(2) { animation-delay: 2.85s; }
  .links a:nth-child(3) { animation-delay: 3.0s; }
  .links a:nth-child(4) { animation-delay: 3.15s; }

  .links a span.label {
    opacity: 0.5;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .links a:hover {
    background: #e8e8ee;
    color: #0b0b0f;
    border-color: #e8e8ee;
  }

  .links a:hover span.label { opacity: 0.7; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes type {
    to { width: calc(4ch + 16px); }
  }

  @keyframes blink {
    50% { border-color: transparent; }
  }

  @keyframes grow {
    to { width: 100%; }
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="cfx.png" alt="blux logo" onerror="this.style.display='none'">

    <h1><span class="typed">CFXE</span></h1>
    <div class="bar"></div>

    <p class="sub">built by blux. programs, tools, and whatever comes next.</p>

</body>
